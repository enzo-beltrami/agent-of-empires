name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR targets its parent branch rather than main,
  # and a base filter would leave every PR but the bottom of the stack with no
  # checks at all.
  pull_request:
  merge_group:

# The event keeps a queue run and the push of its fast-forwarded commit apart.
# Queue generations have distinct refs; cancel-obsolete-queue-runs handles them.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Killswitch: repo variable RUNS_ON_DISABLED=true sends RunsOn jobs to
  # GitHub-hosted runners and keeps kache off AWS (e.g. during an AWS outage).
  RUNS_ON_DISABLED: ${{ vars.RUNS_ON_DISABLED }}
  # .cargo/config.toml caps jobs at 4 for shared dev machines; CI runners are
  # single-tenant, so use every vCPU.
  CARGO_BUILD_JOBS: default

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs before the toolchain: no cargo needed, under a second, and it
      # covers the failure class from #3974 (a raw NUL committed into a source
      # file, which makes git call the file binary and hides its diff from
      # review) on EVERY PR. Nothing else catches it: the code compiles and
      # the tests pass.
      - name: Check no source file carries a raw NUL byte
        run: |
          set -euo pipefail
          python3 scripts/check-no-nul-in-source.py --self-test
          python3 scripts/check-no-nul-in-source.py
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-clippy-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: ./.github/actions/kache
        with:
          manifest-key: clippy
      # `--all-features` so the `web`-gated dashboard tree gets linted too.
      # The web-dist placeholder stands in for the npm bundle that build.rs
      # would otherwise build, so this job still needs no Node setup; same
      # trick as the rustdoc step in the docs job.
      #
      # `--all-targets` so the test binaries join this gate: without it a bare
      # `cargo clippy` checks the lib and bins only, and the Format job cannot
      # stand in for it, since rustfmt type-checks and lints nothing.
      - name: Clippy (all features)
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe clippy placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo clippy --all-features --all-targets -- -D warnings
      # `serve` is a deprecated alias that only turns on `web` (#3619). A
      # `cfg(feature = "serve")` would therefore compile out under
      # `--features web` while still working under the alias: a silent split.
      # Gate on the source so the alias stays inert until it is removed.
      - name: Deprecated `serve` feature-gate guard
        run: |
          set -euo pipefail
          hits="$(grep -rn 'feature *= *"serve"' --include='*.rs' src/ tests/ build.rs || true)"
          if [ -n "$hits" ]; then
            echo "::error::cfg(feature = serve) found; the serve feature is an alias for web. Use feature = web:"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: file_watch consolidation guard
        run: |
          set -euo pipefail
          hits="$(grep -rl 'notify::recommended_watcher' src/ || true)"
          unexpected="$(printf '%s\n' "$hits" | grep -v '^src/file_watch.rs$' | grep . || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::New notify::recommended_watcher found outside src/file_watch.rs:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

  msrv:
    name: MSRV
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-msrv-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: ./.github/actions/kache
        with:
          manifest-key: msrv
      # Lib and bins only: dev-dependencies such as `serial_test` may need a
      # newer compiler without affecting anyone building aoe.
      - name: Check the locked graph on rust-version (core)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --locked --workspace
      - name: Check the locked graph on rust-version (web)
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe msrv placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo +"$MSRV" check --locked --workspace --features web

  web-lint:
    name: Lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting
        working-directory: web
        run: npm run format:check
      - name: Run ESLint
        working-directory: web
        run: npm run lint
      - name: Typecheck test helpers
        working-directory: web
        run: npm run typecheck:tests

  deny:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  docs:
    name: Docs
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.RUNS_ON_DISABLED == 'true') && 'ubuntu-latest' || format('runs-on={0}-docs-{1}/runner=8cpu-linux-x64/family=m8a+c8i+m8i/image=ubuntu26-full-x64/volume=80gb/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      # Routes actions/cache to the RunsOn S3 bucket (Magic Cache); no-op on GitHub-hosted runners.
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/kache
        with:
          manifest-key: docs
      - name: Build xtask and workspace member tests
        run: |
          cargo build -p xtask
          cargo test -p xtask -p aoe-plugin-api --no-run
      # The workspace declares no `default-members`, so every other `cargo
      # test` in these workflows is scoped to the root package (#3479).
      - name: Cargo test (non-default workspace members)
        run: cargo test -p xtask -p aoe-plugin-api
      - name: Check CLI docs are up-to-date
        run: |
          cargo xtask gen-docs
          git diff --exit-code docs/cli/reference.md \
            || (echo "::error::CLI docs are out of date. Run 'cargo xtask gen-docs' and commit." && exit 1)
      - name: Check web setting names are up-to-date
        run: |
          cargo xtask gen-settings-keys
          git diff --exit-code web/src/lib/generated/settingsKeys.ts \
            || (echo "::error::Web setting names are out of date. Run 'cargo xtask gen-settings-keys' and commit." && exit 1)
      - name: Check live wire types are up-to-date
        run: |
          cargo xtask gen-live-wire
          git diff --exit-code web/src/lib/generated/liveWire.ts \
            || (echo "::error::Live wire types are out of date. Run 'cargo xtask gen-live-wire' and commit." && exit 1)
      - name: Check rustdoc is warning-clean
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          mkdir -p target/ci-web-dist
          printf '<!doctype html><title>aoe docs placeholder</title>\n' > target/ci-web-dist/index.html
          AOE_WEB_DIST="$PWD/target/ci-web-dist" cargo doc --no-deps --features web

  script-selftests:
    # Toolchain-free self-tests for the scripts CI relies on.
    name: Script Self-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-shared-target.sh --self-test
