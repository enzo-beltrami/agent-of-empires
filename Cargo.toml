[workspace]
members = [".", "xtask", "aoe-settings-derive", "aoe-plugin-api"]

[package]
name = "agent-of-empires"
version = "1.22.3"
edition = "2021"
rust-version = "1.95"
authors = ["Agent of Empires Contributors"]
description = "Terminal session manager for AI coding agents"
license = "MIT"
repository = "https://github.com/agent-of-empires/agent-of-empires"
keywords = ["tmux", "ai", "claude", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = "4.6"

# In-process VT emulator for the default live-preview path (`src/tmux/vt.rs`,
# opt out with `[tmux] vt_live = false`): parse a pane's raw byte stream into an owned
# grid instead of scraping `capture-pane` snapshots.
vt100 = "0.18"

# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Settings single-source-of-truth derive (#1692)
aoe-settings-derive = { path = "aoe-settings-derive" }

# Plugin manifest and capability types (#268)
aoe-plugin-api = { path = "aoe-plugin-api" }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
ts-rs = { version = "12", optional = true }
serde-saphyr = "1.3"
granit-parser = { version = "1.3", features = ["std"] }
toml = "1.1"
toml_edit = "0.25"
dotenv-ng-core = "1.0"

# File watching
notify = "8.2"

# Shell-style splitting of custom-agent ACP command strings into argv
shell-words = "1.1"

# Insertion-ordered id → Instance map for HomeView.instances.
indexmap = "2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.23", features = ["v4", "serde"] }
zstd = "0.14"

# Random
rand = "0.10"

# Directory utilities
dirs = "7.0"

# Glob expansion for sandbox volume_ignores patterns (e.g. `**/bin`, `**/obj`)
glob = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for updates)
reqwest = { version = "0.13", features = ["json", "query", "rustls", "stream"], default-features = false }

# Percent-encode path segments (release tags) for GitHub API URLs.
percent-encoding = "2"

# Unix sockets + futures-compat for ACP byte streams
tokio-util = { version = "0.7", features = ["codec", "compat", "io-util"] }

# Unicode width + normalization (NFKD used to fold accents in title-derived branch names)
unicode-general-category = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

# Regex
regex = "1.10"

# Git operations
git2 = "0.21"

# Hashing
sha2 = "0.11"

# Locking
fs2 = "0.4"
parking_lot = "0.13"

# Stream utilities
futures-util = "0.3"

# Temporary files and directories
tempfile = "3.14"

# PATH lookup for external viewers (lnav, bat, less) used by `aoe logs`.
which = "8.0"

# SQLite
rusqlite = "0.41"

axum = { version = "0.8", features = ["ws"] }
# hyper/TokioIo reuse the UID/PID-verified UnixStream, including builds without `web`.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Cross-platform browser launcher for `aoe serve --open`.
webbrowser = "1"
tower-http = { version = "0.7", features = ["compression-gzip", "compression-zstd", "fs"] }
# Embedded dashboard bundle, behind `web`.
rust-embed = { version = "8", features = ["debug-embed"], optional = true }
# Content type for the session file-read endpoint.
mime_guess = "2.0"
# QR of the dashboard URL at tunnel startup. Behind `web`:
# scanning it is only useful when there is a dashboard to open.
qrcode = { version = "0.14", optional = true }
argon2 = "0.6"
subtle = "2"
# Passkey (WebAuthn) sign-in for the web dashboard. Links OpenSSL: vendored by the default
# `vendored` feature, from the system otherwise.
webauthn-rs = "0.5"

# OSC 52 clipboard decoding and Web Push payload encoding.
base64 = "0.23"

# Web Push (VAPID + payload encryption).
p256 = { version = "0.14", features = ["pem", "pkcs8", "ecdsa", "ecdh"] }
hkdf = "0.13"
aes-gcm = "0.11"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
getrandom = "0.4"

# Agent Client Protocol — drives the structured view surface.
agent-client-protocol = { version = "5", features = ["unstable_end_turn_token_usage", "unstable_session_fork"] }

# Semver parsing for ACP adapter compatibility checks (see src/acp/agent_compat.rs).
semver = "1"

# Tar stream handling: the structured view's bundled-Node fallback (with xz2
# for tar.xz) and external plugin install (with flate2 for tar.gz). xz2 needs
# system liblzma.
tar = "0.4"
flate2 = "1"
xz2 = "0.1"

# WebSockets for daemon clients and the daemon's local UDS transport.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots", "connect"] }

# Capability-safe file opens for the session file-read endpoint (#3088): open
# beneath a Dir so a component swapped after the containment check cannot
# escape the intended root.
cap-std = "4.0.2"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
schemars = { version = "1", features = ["chrono04"] }

# Unix-only: O_NOFOLLOW for capability-safe filesystem operations.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "net", "fs", "resource", "dir", "user", "poll", "hostname"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[features]
# The daemon (REST/WS API, auth, Web Push, ACP, structured view) is core: a
# plain `cargo build` ships it and needs no Node. `web` adds the embedded
# dashboard bundle, which is what invokes npm; released binaries are built
# `--features web`, so every distributed binary ships the dashboard.
default = ["default-plugins", "vendored"]
# OpenSSL and SQLite vendoring for portable builds.
vendored = ["git2/vendored-openssl", "rusqlite/bundled"]
# Compatibility flag for default plugin selection.
default-plugins = []
# Gates the `e2e` test target (tests/e2e/main.rs). Off by default so CI can run
# the suite as two parallel shards without enumerating every non-e2e test
# binary: `cargo test` runs everything except e2e (the target is skipped when
# the feature is off), and `cargo test --features e2e-tests --test e2e` runs
# e2e only. Naming the target explicitly (`cargo test --test e2e`) without the
# feature errors loudly rather than skipping silently.
e2e-tests = []
# Embedded web dashboard. Builds `web/dist` in build.rs (needs Node and npm),
# serves it from `src/server/assets.rs`, and registers the `aoe.web` builtin.
# Without it the daemon still runs and answers `/api/*`; only the dashboard
# routes are absent.
web = ["rust-embed", "qrcode"]
# Deprecated alias for `web`, kept for one release so existing
# `--features serve` invocations keep building. build.rs warns when it is
# set, and a CI guard rejects any `cfg(feature = "serve")` so the alias
# cannot diverge from `web`.
serve = ["web"]
# Derives `ts_rs::TS` on the live wire types so `cargo xtask gen-live-wire` can
# emit the dashboard's copy. Not needed by any shipped binary.
typescript = ["dep:ts-rs"]

[dev-dependencies]
serial_test = "4.0"
jsonschema = { version = "0.59.0", default-features = false }
syn = { version = "3.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# Test-only tokio clock control (`start_paused`), so the token-rotation
# loop's grace deadline can be asserted without sleeping through it.
# `cargo build` and released binaries never enable `test-util`.
tokio = { version = "1.52", features = ["test-util"] }
# Integration tests are separate crates and don't inherit the normal
# `serde_json` dependency; the acp-runner orphan test parses a worker
# registry record to mutate its pid structurally.
serde_json = "1.0"
# Integration tests are separate crates and don't inherit the normal `toml`
# dependency; the build-cache guard test parses .cargo/config.toml.
toml = "1.1"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt"] }
# Test-only tower dep for `ServiceExt::oneshot`, so the DNS-rebinding gate
# (#2735) can be driven through the real router without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Software authenticator that drives the passkey ceremonies in tests.
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }

[profile.dev]
# Full DWARF is cargo's `dev` default and it dominates `target/`: this table and
# the one below take a `cargo build --lib --bins` here from 5.6 GB to 3.8 GB.
# Line tables keep the file and line number in panics and backtraces; the cost
# is local-variable inspection under a debugger. docs/development.md documents
# the tradeoff and how to opt back into full debug info.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies only; the `"*"` glob never matches a workspace member. Nobody
# reads DWARF for tokio internals, so it is pure weight in every target dir.
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
# Land on the release namespace (app dir, tmux prefix, serve port) so a
# fast-compiled dev-release binary shares state with installed release
# builds. Use the default `dev` profile when you want the isolated
# `-dev` namespace.
debug-assertions = false

[[test]]
# Explicit target so the `e2e-tests` feature gate applies. Without this entry
# Cargo auto-discovers tests/e2e/main.rs unconditionally; the gate lets CI split
# the suite into "everything except e2e" and "e2e only" shards. The other
# test targets (the consolidated `integration` harness and the standalone
# `branch_exists_spawn_failure`) stay auto-discovered.
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e-tests"]

[[bin]]
name = "aoe"
path = "src/main.rs"
