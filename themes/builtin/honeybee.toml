appearance = "dark"

# Bee black with yellow stripes: neutral black surfaces and white text, so the
# yellow is kept for the brand and highlights and stands out against them.
background = "#050505"
border = "#333333"
terminal_border = "#ffcc00"
selection = "#1f1f1f"
session_selection = "#2e2e2e"
title = "#ffd000"
text = "#f5f5f5"
dimmed = "#8c8c8c"
hint = "#b3b3b3"
running = "#4ade80"
# Waiting is the brightest status so it outranks fresh-idle on luminance.
waiting = "#ffe600"
fresh_idle = "#ff9500"
idle = "#5c5c5c"
unread = "#38bdf8"
favorite = "#f472b6"
error = "#ff3b30"
terminal_active = "#ffcc00"
group = "#f5f5f5"
search = "#ffcc00"
accent = "#ffcc00"
diff_add = "#4ade80"
diff_delete = "#ff3b30"
diff_modified = "#ffcc00"
diff_header = "#a3a3a3"
help_key = "#ffcc00"
branch = "#c8c8c8"
sandbox = "#a78bfa"

[syntax]
shiki_theme = "github-dark-high-contrast"
