[build]
# Several worktree sessions often build at once; each claiming 8 jobs
# oversubscribes the host and pushes it into swap. Override with
# CARGO_BUILD_JOBS for a solo build.
jobs = 4

[alias]
xtask = "run -p xtask --"
# The local dashboard build. A lone deploy build may use most of the host, so it
# overrides `jobs` above; parallel worktree builds keep the default.
deploy-build = "build --profile dev-release --features web -j 12"
